<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North Star Bakery - Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Lora:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="logo-container">
            <img src="bakery-logo_c.png" alt="North Star Bakery Logo featuring a stylized loaf of bread and wheat" width="200">
        </div>
        <nav class="main-nav">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <h1>Contact & Pre-Orders</h1>
        <p>Have a question or want to reserve a loaf? Fill out the form below.</p>

        <form action="#" method="POST" class="contact-form">
            <fieldset>
                <legend>Customer Information</legend>
                
                <div class="form-group">
                    <label for="fullName">Full Name (Required):</label>
                    <input type="text" id="fullName" name="fullName" required>
                </div>
                
                <div class="form-group">
                    <label for="emailAddress">Email Address (Required):</label>
                    <input type="email" id="emailAddress" name="emailAddress" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Order Details</legend>

                <div class="form-group">
                    <label for="breadType">Preferred Bread:</label>
                    <select id="breadType" name="breadType">
                        <option value="sourdough">Seasonal Sourdough</option>
                        <option value="artisan">Classic Artisan</option>
                        <option value="seeded">Signature Seeded</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Additional Comments:</label>
                    <textarea id="message" name="message" rows="4"></textarea>
                </div>
            </fieldset>

            <button type="submit" class="submit-btn">Submit Request</button>
        </form>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 North Star Bakery. All rights reserved.</p>
    </footer>
</body>
</html>
